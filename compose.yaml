services:
  energytool:
    build: .
    image: energytool-ai:latest
    container_name: energytool-ai
    ports:
      - "8000:8000"
    environment:
      # Без ключей контейнер поднимается в демо-режиме (BM25 + курируемые ответы).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.8-27b}
      EMB_MODEL: ${EMB_MODEL:-BAAI/bge-m3}
      RERANKER_MODEL: ${RERANKER_MODEL:-Qwen/Qwen3-Reranker-8B}
      USE_EMBEDDINGS: ${USE_EMBEDDINGS:-1}
      USE_RERANKER: ${USE_RERANKER:-1}
      TEMPERATURE: ${TEMPERATURE:-0.1}
      MAX_TOKENS: ${MAX_TOKENS:-700}
      TOP_K: ${TOP_K:-8}
      DB_PATH: /app/storage/app.db
    volumes:
      - energytool-storage:/app/storage
    restart: unless-stopped

volumes:
  energytool-storage:
